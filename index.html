<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --mesa: #e9e4da;
    --papel: #fff9c9;
    --pauta: #a8c4e6;
    --margem: #e8a0a0;
    --tinta: #2a2a2a;
    --suave: #7a7466;
    --linha: 40px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--mesa);
    color: var(--tinta);
    font: 20px/var(--linha) "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .papel {
    max-width: 1000px;
    min-height: 100vh;
    margin: 0 auto;
    background-color: var(--papel);
    background-image:
      linear-gradient(to right, transparent 63px, var(--margem) 63px, var(--margem) 65px, transparent 65px),
      repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--linha) - 1px), var(--pauta) calc(var(--linha) - 1px), var(--pauta) var(--linha));
    box-shadow: 0 0 24px rgba(0, 0, 0, .12);
    padding: var(--linha) 24px var(--linha) 84px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    line-height: var(--linha);
    margin: 0;
  }
  .atualizado {
    font-size: 15px;
    color: var(--suave);
    margin: 0;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li::before { content: "– "; color: var(--suave); }
  .vazio { color: var(--suave); font-style: italic; margin: 0; }

  @media (max-width: 600px) {
    body { font-size: 18px; }
    .papel {
      background-image:
        linear-gradient(to right, transparent 35px, var(--margem) 35px, var(--margem) 37px, transparent 37px),
        repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--linha) - 1px), var(--pauta) calc(var(--linha) - 1px), var(--pauta) var(--linha));
      padding-left: 50px;
      padding-right: 16px;
    }
  }
</style>
</head>
<body>
<main class="papel">
  <h1>Notas Spun</h1>
  <p class="atualizado" id="atualizado"></p>
  <ul id="notas"></ul>
</main>

<script>
  // ============================================================
  //  NOTAS — edite só esta parte.
  // ============================================================
  const ATUALIZADO = "28/10/2026 às 13:21";

  const NOTAS = [
    "Usar no mínimo R$ 500/dia nas operações Roblox",
    "Trabalhar com uma estrutura de campanhas mais ampla e robusta",
  ];
  // ============================================================

  document.getElementById("atualizado").textContent = "Atualizado em " + ATUALIZADO;
  const lista = document.getElementById("notas");
  if (!NOTAS.length) lista.outerHTML = '<p class="vazio">Nada anotado.</p>';
  NOTAS.forEach(texto => {
    const li = document.createElement("li");
    li.textContent = texto;
    lista.append(li);
  });
</script>
</body>
</html>
