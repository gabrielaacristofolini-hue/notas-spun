<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6;
    --paper: #fffdf8;
    --line: #e7e0d2;
    --margin: #f0b8b0;
    --ink: #2b2a27;
    --muted: #8a8478;
    --accent: #c2553f;
    --done: #b5afa3;
    --shadow: 0 1px 2px rgba(60, 50, 30, .06), 0 8px 24px rgba(60, 50, 30, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --paper: #24221f;
      --line: #34312c;
      --margin: #5a3631;
      --ink: #ece7dd;
      --muted: #9a9387;
      --accent: #e98a72;
      --done: #6b665d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }

  header { margin-bottom: 20px; }
  h1 {
    font-family: Caveat, cursive;
    font-size: 44px;
    line-height: 1;
    margin: 0 0 6px;
  }
  .hoje-data { color: var(--muted); font-size: 15px; text-transform: capitalize; }

  .folha {
    background: var(--paper);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 20px 20px 16px 44px;
    margin-bottom: 20px;
    position: relative;
    background-image: linear-gradient(to right, transparent 31px, var(--margin) 31px, var(--margin) 32px, transparent 32px);
  }
  .folha h2 {
    font-family: Caveat, cursive;
    font-size: 28px;
    line-height: 1.1;
    margin: 0 0 8px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .folha h2 small {
    font-family: Inter, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .folha.hoje h2 { color: var(--accent); }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  label {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 10px 0;
    cursor: pointer;
  }
  input[type=checkbox] {
    appearance: none;
    flex: none;
    width: 20px;
    height: 20px;
    margin: 2px 0 0;
    border: 2px solid var(--muted);
    border-radius: 5px;
    display: grid;
    place-content: center;
    cursor: pointer;
  }
  input[type=checkbox]::after {
    content: "";
    width: 10px;
    height: 6px;
    border: solid var(--paper);
    border-width: 0 0 2px 2px;
    transform: rotate(-45deg) translate(1px, -1px);
    opacity: 0;
  }
  input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after { opacity: 1; }
  input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:checked + span { color: var(--done); text-decoration: line-through; }

  .vazio { color: var(--muted); font-style: italic; padding: 8px 0; margin: 0; }
  .progresso { font-size: 13px; color: var(--muted); margin-top: 6px; }

  details.anteriores > summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
    padding: 8px 0 16px;
    list-style: none;
  }
  details.anteriores > summary::before { content: "▸ "; }
  details.anteriores[open] > summary::before { content: "▾ "; }
  details.anteriores .folha { opacity: .8; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Notas Spun</h1>
    <div class="hoje-data" id="hoje-data"></div>
  </header>
  <div id="notas"></div>
</main>

<script>
  // ============================================================
  //  NOTAS — edite só esta parte.
  //  Cada bloco é um dia ("AAAA-MM-DD") ou "geral" (sem data).
  // ============================================================
  const NOTAS = [
    // { dia: "2026-10-27", itens: ["Exemplo de tarefa"] },
  ];
  // ============================================================

  const pad = n => String(n).padStart(2, "0");
  const agora = new Date();
  const hojeISO = `${agora.getFullYear()}-${pad(agora.getMonth() + 1)}-${pad(agora.getDate())}`;
  const paraData = iso => new Date(iso + "T12:00:00");
  const fmt = (iso, opts) => paraData(iso).toLocaleDateString("pt-BR", opts);

  document.getElementById("hoje-data").textContent =
    fmt(hojeISO, { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  function lerFeitos() {
    try { return JSON.parse(localStorage.getItem("notas-spun-feitos")) || {}; } catch { return {}; }
  }
  function salvarFeitos(f) {
    try { localStorage.setItem("notas-spun-feitos", JSON.stringify(f)); } catch {}
  }
  const feitos = lerFeitos();

  function titulo(bloco) {
    if (bloco.dia === "geral") return { nome: "Geral", sub: "" };
    const amanha = new Date(agora); amanha.setDate(agora.getDate() + 1);
    const amanhaISO = `${amanha.getFullYear()}-${pad(amanha.getMonth() + 1)}-${pad(amanha.getDate())}`;
    const sub = fmt(bloco.dia, { weekday: "long", day: "numeric", month: "short" });
    if (bloco.dia === hojeISO) return { nome: "Hoje", sub };
    if (bloco.dia === amanhaISO) return { nome: "Amanhã", sub };
    return { nome: fmt(bloco.dia, { day: "numeric", month: "long" }), sub: fmt(bloco.dia, { weekday: "long" }) };
  }

  function folha(bloco) {
    const sec = document.createElement("section");
    sec.className = "folha" + (bloco.dia === hojeISO ? " hoje" : "");
    const t = titulo(bloco);
    const h2 = document.createElement("h2");
    h2.textContent = t.nome;
    if (t.sub) { const s = document.createElement("small"); s.textContent = t.sub; h2.append(s); }
    sec.append(h2);

    const ul = document.createElement("ul");
    const prog = document.createElement("div");
    prog.className = "progresso";
    const atualizar = () => {
      const marcados = ul.querySelectorAll("input:checked").length;
      prog.textContent = `${marcados} de ${bloco.itens.length} feitos`;
    };

    bloco.itens.forEach((texto, i) => {
      const chave = `${bloco.dia}|${i}|${texto}`;
      const li = document.createElement("li");
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!feitos[chave];
      cb.addEventListener("change", () => {
        if (cb.checked) feitos[chave] = 1; else delete feitos[chave];
        salvarFeitos(feitos);
        atualizar();
      });
      const span = document.createElement("span");
      span.textContent = texto;
      label.append(cb, span);
      li.append(label);
      ul.append(li);
    });
    sec.append(ul);
    if (bloco.itens.length > 1) { atualizar(); sec.append(prog); }
    return sec;
  }

  const raiz = document.getElementById("notas");
  const comItens = NOTAS.filter(b => b.itens && b.itens.length);
  const proximos = comItens.filter(b => b.dia !== "geral" && b.dia >= hojeISO).sort((a, b) => a.dia.localeCompare(b.dia));
  const gerais = comItens.filter(b => b.dia === "geral");
  const anteriores = comItens.filter(b => b.dia !== "geral" && b.dia < hojeISO).sort((a, b) => b.dia.localeCompare(a.dia));

  if (!proximos.some(b => b.dia === hojeISO)) {
    const vazio = document.createElement("section");
    vazio.className = "folha hoje";
    vazio.innerHTML = '<h2>Hoje</h2><p class="vazio">Nada anotado para hoje.</p>';
    raiz.append(vazio);
  }
  proximos.forEach(b => raiz.append(folha(b)));
  gerais.forEach(b => raiz.append(folha(b)));

  if (anteriores.length) {
    const det = document.createElement("details");
    det.className = "anteriores";
    const sum = document.createElement("summary");
    sum.textContent = `Dias anteriores (${anteriores.length})`;
    det.append(sum);
    anteriores.forEach(b => det.append(folha(b)));
    raiz.append(det);
  }
</script>
</body>
</html>
