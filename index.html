<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #e4e2dd;
    --tinta: #2a2a2a;
    --suave: #6f6c66;
    --fio: 1px solid rgba(42, 42, 42, .3);
    --linha: 2px solid var(--tinta);
    --colunas: 56px minmax(0, 1fr) minmax(0, 1.25fr);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--papel);
    color: var(--tinta);
    font: 500 18px/1.45 "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pagina {
    max-width: 1240px;
    margin: 0 auto;
    padding: 48px 24px 56px;
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(36px, 4.6vw, 64px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.045em;
    margin: 0 0 0 -.03em;
    white-space: nowrap;
  }
  .carimbo {
    display: flex;
    gap: 14px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.01em;
    white-space: nowrap;
  }

  /* ---------- Quadro: uma faixa por operação ---------- */
  .quadro { border-top: var(--linha); border-bottom: var(--linha); }
  .colunas, .operacao {
    display: grid;
    grid-template-columns: var(--colunas);
    column-gap: 24px;
  }
  .colunas {
    padding: 10px 0;
    border-bottom: var(--fio);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--suave);
  }
  .colunas span:first-child { grid-column: 2; }

  .operacao { padding: 22px 0 26px; border-bottom: var(--fio); row-gap: 10px; }
  .operacao:last-child { border-bottom: 0; }
  .numero {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--suave);
    font-variant-numeric: tabular-nums;
    align-self: center;
  }
  .operacao h2 {
    grid-column: 2 / -1;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -.025em;
    margin: 0;
  }
  .metas { grid-column: 2; }
  .tarefas { grid-column: 3; }

  ul { margin: 0; padding-left: 22px; }
  ul li { padding-left: 4px; margin-bottom: 6px; }
  ul li:last-child { margin-bottom: 0; }
  ul li::marker { color: var(--suave); }
  ul.etapas { margin-top: 6px; list-style: circle; }
  ul.etapas li { margin-bottom: 4px; }
  .vazio { color: var(--suave); margin: 0; }

  @media (max-width: 860px) {
    .colunas { display: none; }
    .operacao { grid-template-columns: 40px minmax(0, 1fr); }
    .metas, .tarefas { grid-column: 2; }
    .metas::before, .tarefas::before {
      display: block;
      margin: 6px 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--suave);
    }
    .metas::before { content: "Metas"; }
    .tarefas::before { content: "Tarefas"; }
  }
  @media (max-width: 600px) {
    .pagina { padding: 28px 16px 40px; }
    .carimbo { font-size: 15px; }
    body { font-size: 17px; }
    .operacao h2 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <h1>Notas Spun</h1>
    <div class="carimbo">
      <span id="atualizado"></span>
      <span id="data"></span>
    </div>
  </header>

  <main class="quadro" id="quadro">
    <div class="colunas"><span>Metas</span><span>Tarefas</span></div>
  </main>
</div>

<script>
  // ============================================================
  //  OPERAÇÕES: edite só esta parte.
  //  Cada operação tem suas metas e suas tarefas.
  //  Item com detalhes: ["Título", ["linha 1", "linha 2"]].
  // ============================================================
  const ATUALIZADO = "16/11/2026 às 10:38";

  const OPERACOES = [
    {
      nome: "JN US CC",
      metas: [
        "R$ 20 mil/dia com ROAS de −20%",
        ["R01: R$ 3 mil de gasto em geração de demanda", [
          "Com ROAS, o quanto antes",
        ]],
      ],
      tarefas: [
        "Subir novas campanhas com meta de compra",
        "Inserir novos anúncios responsivos em todas as subs (R01, R03 e R04)",
        ["Puxar campanhas antigas com bom desempenho e tentar destravar", [
          "Em todas as subs, inclusive as que estão pausadas",
        ]],
        "R01: inserir novos grupos de anúncio nas campanhas por conversão",
        ["R03: plano para destravar as campanhas por conversão", [
          "Subir segmentadas aos nossos domínios por um tempo",
        ]],
        "Puxar a conta que paga por conversão da JN US EMP",
      ],
    },
    {
      nome: "Roblox",
      metas: ["Estabilizar a compra abaixo de R$ 2,30, com ROAS"],
      tarefas: [],
    },
    {
      nome: "BG MX",
      metas: ["Estabilizar a compra buscando ROAS"],
      tarefas: ["Acompanhar canais de compra e otimização geral"],
    },
    {
      nome: "BG BR",
      metas: ["Estabilizar a compra buscando ROAS"],
      tarefas: ["Acompanhar canais de compra e otimização geral"],
    },
    {
      nome: "Shein",
      metas: ["Estabilizar a compra buscando ROAS"],
      tarefas: [
        "Criar novos criativos",
        "Acompanhar canais de compra e otimização geral",
      ],
    },
  ];
  // ============================================================

  const [dia, hora] = ATUALIZADO.split(" às ");
  const [d, m, a] = dia.split("/");
  document.getElementById("data").textContent = `[ ${d}.${m}.${a.slice(2)} ]`;
  document.getElementById("atualizado").textContent = `atualizado às ${hora}`;

  function el(tag, classe, texto) {
    const no = document.createElement(tag);
    if (classe) no.className = classe;
    if (texto) no.textContent = texto;
    return no;
  }

  // Lista de itens; um item pode trazer linhas de detalhe embaixo.
  function lista(itens, classe, vazio) {
    const caixa = el("div", classe);
    if (!itens.length) {
      caixa.append(el("p", "vazio", vazio));
      return caixa;
    }
    const ul = el("ul");
    itens.forEach(item => {
      const [titulo, detalhes] = typeof item === "string" ? [item, []] : item;
      const li = el("li", "", titulo);
      if (detalhes.length) {
        const sub = el("ul", "etapas");
        detalhes.forEach(linha => sub.append(el("li", "", linha)));
        li.append(sub);
      }
      ul.append(li);
    });
    caixa.append(ul);
    return caixa;
  }

  const quadro = document.getElementById("quadro");
  OPERACOES.forEach((op, i) => {
    const faixa = el("section", "operacao");
    faixa.append(
      el("span", "numero", String(i + 1).padStart(2, "0")),
      el("h2", "", op.nome),
      lista(op.metas, "metas", "Sem meta definida"),
      lista(op.tarefas, "tarefas", "Sem tarefas abertas"),
    );
    quadro.append(faixa);
  });
</script>
</body>
</html>
