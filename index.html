<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #e4e2dd;
    --tinta: #2a2a2a;
    --suave: #6f6c66;
    --linha: 2px solid var(--tinta);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--papel);
    color: var(--tinta);
    font: 500 18px/1.45 "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pagina {
    max-width: 1240px;
    margin: 0 auto;
    padding: 48px 24px 56px;
  }

  /* ---------- Cabeçalho ---------- */
  header { position: relative; }
  h1 {
    font-size: clamp(44px, 7vw, 104px);
    font-weight: 800;
    line-height: .9;
    letter-spacing: -.05em;
    margin: 0 0 0 -.03em;
    white-space: nowrap;
  }
  .data {
    position: absolute;
    top: 6px; right: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .atualizado {
    text-align: center;
    font-weight: 700;
    font-size: 17px;
    margin: 18px 0 22px;
  }

  /* ---------- Quadro ---------- */
  .quadro {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    border: var(--linha);
  }
  .celula { padding: 22px 26px 26px; }
  .celula + .celula { border-left: var(--linha); }
  .rotulo {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
  }

  ol {
    margin: 0;
    padding-left: 26px;
  }
  ol li { padding-left: 4px; margin-bottom: 6px; }
  ol li::marker { font-weight: 500; }
  b { font-weight: 700; }

  .vazio { color: var(--suave); margin: 0; }

  @media (max-width: 860px) {
    .quadro { grid-template-columns: 1fr; }
    .celula + .celula { border-left: 0; border-top: var(--linha); }
  }
  @media (max-width: 600px) {
    .pagina { padding: 28px 16px 40px; }
    .data { position: static; display: block; margin-bottom: 10px; font-size: 16px; }
    body { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <span class="data" id="data"></span>
    <h1>Notas Spun.</h1>
  </header>
  <p class="atualizado" id="atualizado"></p>

  <div class="quadro">
    <section class="celula">
      <p class="rotulo">Tarefas:</p>
      <ol id="notas"></ol>
    </section>
    <aside class="celula">
      <p class="rotulo">Metas:</p>
      <ol id="metas"></ol>
    </aside>
  </div>
</div>

<script>
  // ============================================================
  //  NOTAS e METAS — edite só esta parte.
  //  "Operação: tarefa" deixa o nome da operação em negrito.
  // ============================================================
  const ATUALIZADO = "06/11/2026 às 15:58";

  const NOTAS = [
    "JN US CC: subir novas campanhas com meta de compra",
    "JN US CC: subir novas campanhas de geração de demanda",
    "Puxar a conta que paga por conversão da JN US EMP para a JN US CC",
  ];

  // Metas: [operação, meta]
  const METAS = [
    ["JN US CC", "R$ 30 mil/dia com ROAS de −20%"],
    ["Roblox", "escalar com ROAS de +20% a +30%"],
    ["BG MX", "estabilizar a compra"],
  ];
  // ============================================================

  const [dia, hora] = ATUALIZADO.split(" às ");
  const [d, m, a] = dia.split("/");
  document.getElementById("data").textContent = `[ ${d}.${m}.${a.slice(2)} ]`;
  document.getElementById("atualizado").textContent = `- atualizado às ${hora} -`;

  // Tarefas e metas usam o mesmo formato: operação em negrito — texto.
  function item(operacao, texto) {
    const li = document.createElement("li");
    if (operacao) {
      const b = document.createElement("b");
      b.textContent = operacao;
      li.append(b, " — " + texto);
    } else {
      li.textContent = texto;
    }
    return li;
  }

  const lista = document.getElementById("notas");
  if (!NOTAS.length) lista.outerHTML = '<p class="vazio">Nada anotado.</p>';
  NOTAS.forEach(texto => {
    const p = texto.match(/^([^:]{1,30}):\s*(.+)$/);
    lista.append(p ? item(p[1], p[2]) : item(null, texto));
  });

  const metas = document.getElementById("metas");
  METAS.forEach(([operacao, meta]) => metas.append(item(operacao, meta)));
</script>
</body>
</html>
