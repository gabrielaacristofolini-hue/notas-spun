<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #0c0c0d;
    --painel: #151517;
    --borda: #26262a;
    --texto: #ededef;
    --suave: #8b8b93;
    --amarelo: #f5c542;
    --verde: #4ad295;
    --rosa: #f27a9b;
    --azul: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fundo);
    color: var(--texto);
    font: 400 17px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pagina {
    max-width: 1240px;
    margin: 0 auto;
    padding: 40px 24px 56px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  .atualizado { color: var(--suave); font-size: 14px; }

  .grade {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 24px;
    align-items: start;
  }
  .painel {
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 14px;
    padding: 8px 24px;
  }
  .painel h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--suave);
    margin: 16px 0 4px;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li, .meta {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 0;
    border-bottom: 1px solid var(--borda);
  }
  li:last-child, .meta:last-child { border-bottom: 0; }

  .tag {
    flex: none;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .02em;
    padding: 3px 9px;
    border-radius: 999px;
    color: var(--cor);
    background: color-mix(in srgb, var(--cor) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--cor) 30%, transparent);
    white-space: nowrap;
  }
  .meta { flex-direction: column; gap: 6px; }
  .meta strong { font-size: 18px; font-weight: 600; }

  .vazio { color: var(--suave); padding: 16px 0; margin: 0; }

  @media (max-width: 900px) {
    .grade { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .pagina { padding: 24px 16px 40px; }
    li { flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <h1>Notas Spun</h1>
    <span class="atualizado" id="atualizado"></span>
  </header>

  <div class="grade">
    <section class="painel">
      <h2>Tarefas</h2>
      <ul id="notas"></ul>
    </section>
    <aside class="painel">
      <h2>Metas</h2>
      <div id="metas"></div>
    </aside>
  </div>
</div>

<script>
  // ============================================================
  //  NOTAS e METAS — edite só esta parte.
  //  "Operação: tarefa" mostra a operação como etiqueta colorida.
  // ============================================================
  const ATUALIZADO = "06/11/2026 às 15:49";

  const NOTAS = [
    "JN US CC: subir novas campanhas com meta de compra",
    "JN US CC: subir novas campanhas de geração de demanda",
    "Puxar a conta que paga por conversão da JN US EMP para a JN US CC",
  ];

  // Metas: [operação, meta]
  const METAS = [
    ["JN US CC", "R$ 30 mil/dia com ROAS de −20%"],
    ["Roblox", "Escalar com ROAS de +20% a +30%"],
    ["BG MX", "Estabilizar a compra"],
  ];
  // ============================================================

  document.getElementById("atualizado").textContent = "Atualizado em " + ATUALIZADO;

  // Cada operação ganha sempre a mesma cor.
  const cores = ["--amarelo", "--verde", "--rosa", "--azul"];
  const corDe = {};
  function tag(operacao) {
    if (!(operacao in corDe)) corDe[operacao] = cores[Object.keys(corDe).length % cores.length];
    const span = document.createElement("span");
    span.className = "tag";
    span.style.setProperty("--cor", `var(${corDe[operacao]})`);
    span.textContent = operacao;
    return span;
  }

  const lista = document.getElementById("notas");
  if (!NOTAS.length) lista.outerHTML = '<p class="vazio">Nada anotado.</p>';
  NOTAS.forEach(texto => {
    const li = document.createElement("li");
    const m = texto.match(/^([^:]{1,30}):\s*(.+)$/);
    const frase = document.createElement("span");
    if (m) {
      frase.textContent = m[2].charAt(0).toUpperCase() + m[2].slice(1);
      li.append(tag(m[1]), frase);
    } else {
      frase.textContent = texto;
      li.append(frase);
    }
    lista.append(li);
  });

  const metas = document.getElementById("metas");
  METAS.forEach(([operacao, meta]) => {
    const div = document.createElement("div");
    div.className = "meta";
    const forte = document.createElement("strong");
    forte.textContent = meta;
    div.append(tag(operacao), forte);
    metas.append(div);
  });
</script>
</body>
</html>
