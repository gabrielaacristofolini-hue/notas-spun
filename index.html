<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6;
    --paper: #fffdf8;
    --line: #e7e0d2;
    --margin: #f0b8b0;
    --ink: #2b2a27;
    --muted: #8a8478;
    --accent: #c2553f;
    --accent-soft: #f7e1da;
    --done: #b5afa3;
    --shadow: 0 1px 2px rgba(60, 50, 30, .06), 0 8px 24px rgba(60, 50, 30, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --paper: #24221f;
      --line: #34312c;
      --margin: #5a3631;
      --ink: #ece7dd;
      --muted: #9a9387;
      --accent: #e98a72;
      --accent-soft: #43292280;
      --done: #6b665d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }

  header { margin-bottom: 20px; }
  h1 {
    font-family: Caveat, cursive;
    font-size: 44px;
    line-height: 1;
    margin: 0 0 6px;
  }
  .hoje-data { color: var(--muted); font-size: 15px; }

  .folha {
    background: var(--paper);
    border-radius: 6px;
    box-shadow: var(--shadow);
    padding: 20px 20px 16px 44px;
    margin-bottom: 20px;
    background-image: linear-gradient(to right, transparent 31px, var(--margin) 31px, var(--margin) 32px, transparent 32px);
  }
  .folha h2 {
    font-family: Caveat, cursive;
    font-size: 30px;
    line-height: 1.1;
    margin: 0 0 4px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .folha h2 small {
    font-family: Inter, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .folha.hoje h2 { color: var(--accent); }
  .folha h3 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 16px 0 2px;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  label {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 10px 0;
    cursor: pointer;
  }
  input[type=checkbox] {
    appearance: none;
    flex: none;
    width: 20px;
    height: 20px;
    margin: 2px 0 0;
    border: 2px solid var(--muted);
    border-radius: 5px;
    display: grid;
    place-content: center;
    cursor: pointer;
  }
  input[type=checkbox]::after {
    content: "";
    width: 10px;
    height: 6px;
    border: solid var(--paper);
    border-width: 0 0 2px 2px;
    transform: rotate(-45deg) translate(1px, -1px);
    opacity: 0;
  }
  input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after { opacity: 1; }
  input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:checked + span { color: var(--done); text-decoration: line-through; }
  .prioridade {
    display: inline-block;
    margin-left: 6px;
    padding: 0 7px;
    border-radius: 99px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    vertical-align: 2px;
  }

  .vazio { color: var(--muted); font-style: italic; padding: 8px 0; margin: 0; }
  .progresso { font-size: 13px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Notas Spun</h1>
    <div class="hoje-data" id="hoje-data"></div>
  </header>
  <div id="notas"></div>
</main>

<script>
  // ============================================================
  //  NOTAS — edite só esta parte.
  //  Cada folha é um dia ("AAAA-MM-DD"), dividida em grupos.
  //  Item com destaque: { texto: "...", prioridade: true }
  // ============================================================
  const NOTAS = [
    {
      dia: "2026-10-26",
      grupos: [
        {
          titulo: "Para o dia",
          itens: [
            "Usar os R$ 500/dia em Total Finanças e Lunex 3 (obrigatório, replicar a campanha que fechou a 2,20)",
            "Ajuste fino nas campanhas com pag/conv na R03",
            "Expandir para tópico as campanhas que ainda compram só em domínio",
            "Escalar Lunex 2 com cuidado (CPA pode aumentar perto das 9h)",
          ],
        },
        {
          titulo: "Não necessariamente hoje",
          itens: [
            { texto: "Levantar % de entrega das campanhas por conversão R01 e R03", prioridade: true },
            "Desenhar rotas de escala para JN cartão (progressão suave, 20k para 30k)",
            "Mapear gargalos das pré-vendas (carregamento, custo, ranqueamento, conversão na P1)",
          ],
        },
        {
          titulo: "Anotações",
          itens: [
            "Expandir Lunex para Reino Unido e Canadá",
            "Conferir perguntas para trocar na presell da Bolviro e da Lunex 2",
          ],
        },
      ],
    },
  ];
  // ============================================================

  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const agora = new Date();
  const hojeISO = iso(agora);
  const ontem = new Date(agora); ontem.setDate(agora.getDate() - 1);
  const ontemISO = iso(ontem);
  const fmt = (dia, opts) => new Date(dia + "T12:00:00").toLocaleDateString("pt-BR", opts);

  document.getElementById("hoje-data").textContent =
    "Hoje é " + fmt(hojeISO, { weekday: "long", day: "numeric", month: "long" });

  function lerFeitos() {
    try { return JSON.parse(localStorage.getItem("notas-spun-feitos")) || {}; } catch { return {}; }
  }
  function salvarFeitos(f) {
    try { localStorage.setItem("notas-spun-feitos", JSON.stringify(f)); } catch {}
  }
  const feitos = lerFeitos();

  function folha(bloco) {
    const sec = document.createElement("section");
    sec.className = "folha" + (bloco.dia === hojeISO ? " hoje" : "");

    const h2 = document.createElement("h2");
    h2.textContent = fmt(bloco.dia, { day: "numeric", month: "long" });
    const sub = document.createElement("small");
    const rel = bloco.dia === hojeISO ? "hoje · " : bloco.dia === ontemISO ? "ontem · " : "";
    sub.textContent = rel + fmt(bloco.dia, { weekday: "long" });
    h2.append(sub);
    sec.append(h2);

    const caixas = [];
    const prog = document.createElement("div");
    prog.className = "progresso";
    const atualizar = () => {
      const marcados = caixas.filter(c => c.checked).length;
      prog.textContent = `${marcados} de ${caixas.length} feitos`;
    };

    bloco.grupos.filter(g => g.itens.length).forEach(grupo => {
      if (grupo.titulo) {
        const h3 = document.createElement("h3");
        h3.textContent = grupo.titulo;
        sec.append(h3);
      }
      const ul = document.createElement("ul");
      grupo.itens.forEach(item => {
        const texto = typeof item === "string" ? item : item.texto;
        const chave = `${bloco.dia}|${texto}`;
        const li = document.createElement("li");
        const label = document.createElement("label");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = !!feitos[chave];
        cb.addEventListener("change", () => {
          if (cb.checked) feitos[chave] = 1; else delete feitos[chave];
          salvarFeitos(feitos);
          atualizar();
        });
        caixas.push(cb);
        const span = document.createElement("span");
        span.textContent = texto;
        if (item.prioridade) {
          const tag = document.createElement("span");
          tag.className = "prioridade";
          tag.textContent = "prioridade";
          span.append(tag);
        }
        label.append(cb, span);
        li.append(label);
        ul.append(li);
      });
      sec.append(ul);
    });

    if (caixas.length > 1) { atualizar(); sec.append(prog); }
    return sec;
  }

  // Mais recente primeiro; nada some — é só marcar o que foi feito.
  const raiz = document.getElementById("notas");
  const dias = NOTAS.filter(b => b.grupos.some(g => g.itens.length)).sort((a, b) => b.dia.localeCompare(a.dia));
  if (!dias.length) raiz.innerHTML = '<section class="folha"><p class="vazio">Nada anotado ainda.</p></section>';
  dias.forEach(b => raiz.append(folha(b)));
</script>
</body>
</html>
