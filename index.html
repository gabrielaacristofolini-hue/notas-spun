<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #e4e2dd;
    --tinta: #2a2a2a;
    --suave: #6f6c66;
    --linha: 2px solid var(--tinta);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--papel);
    color: var(--tinta);
    font: 500 18px/1.45 "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pagina {
    max-width: 1240px;
    margin: 0 auto;
    padding: 48px 24px 56px;
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(36px, 4.6vw, 64px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.045em;
    margin: 0 0 0 -.03em;
    white-space: nowrap;
  }
  .carimbo {
    display: flex;
    gap: 14px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.01em;
    white-space: nowrap;
  }

  /* ---------- Quadro ---------- */
  .quadro {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: 24px;
    align-items: stretch;
  }
  .celula { padding: 22px 26px 26px; border: var(--linha); }
  .rotulo {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
  }

  ul {
    margin: 0;
    padding-left: 26px;
  }
  ul li { padding-left: 4px; margin-bottom: 6px; }
  ul li::marker { color: var(--suave); }
  ul.etapas { margin-top: 6px; padding-left: 22px; list-style: circle; }
  ul.etapas li { margin-bottom: 4px; }

  /* Metas: cada operação com subtítulo e linha divisória entre elas. */
  .operacao { padding: 12px 0; border-bottom: 1px solid rgba(42, 42, 42, .35); }
  .operacao:first-child { padding-top: 0; }
  .operacao:last-child { border-bottom: 0; padding-bottom: 0; }
  .operacao h3 { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  .operacao li { margin: 0; }

  .vazio { color: var(--suave); margin: 0; }

  @media (max-width: 860px) {
    .quadro { grid-template-columns: 1fr; gap: 16px; }
  }
  @media (max-width: 600px) {
    .pagina { padding: 28px 16px 40px; }
    .carimbo { font-size: 15px; }
    body { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <h1>Notas Spun</h1>
    <div class="carimbo">
      <span id="atualizado"></span>
      <span id="data"></span>
    </div>
  </header>

  <div class="quadro">
    <section class="celula">
      <p class="rotulo">Tarefas:</p>
      <ul id="notas"></ul>
    </section>
    <aside class="celula">
      <p class="rotulo">Metas:</p>
      <div id="metas"></div>
    </aside>
  </div>
</div>

<script>
  // ============================================================
  //  NOTAS e METAS: edite só esta parte.
  //  Escreva cada item como "Operação: tarefa".
  //  Item com várias etapas: ["Título", ["etapa 1", "etapa 2"]].
  // ============================================================
  const ATUALIZADO = "10/11/2026 às 11:19";

  const NOTAS = [
    "JN US CC: subir novas campanhas com meta de compra",
    ["JN US CC R03: refazer a estrutura", [
      "Remover todos os criativos e grupos ativos",
      "Inserir novos grupos e criativos (por conversão e Max Conv)",
      "Subir novas campanhas de geração de demanda",
      "Remover todas as exclusões de URL",
    ]],
    "Puxar a conta que paga por conversão da JN US EMP para a JN US CC",
    "Roblox: subir novas campanhas na Lunex 2 e na Lunex 3",
    "BGs (MX e BR): negativar palavras-chave de jogos, games e Roblox",
  ];

  // Metas: [operação, meta]
  const METAS = [
    ["JN US CC", "R$ 20 mil/dia com ROAS de −20%"],
    ["Roblox", "Estabilizar a compra abaixo de R$ 2,30, com ROAS"],
    ["BG MX", "Estabilizar a compra buscando ROAS"],
    ["BG BR", "Estabilizar a compra buscando ROAS"],
    ["Shen", "Estabilizar a compra e buscar ROI"],
  ];
  // ============================================================

  const [dia, hora] = ATUALIZADO.split(" às ");
  const [d, m, a] = dia.split("/");
  document.getElementById("data").textContent = `[ ${d}.${m}.${a.slice(2)} ]`;
  document.getElementById("atualizado").textContent = `atualizado às ${hora}`;

  function item(texto) {
    const li = document.createElement("li");
    li.textContent = texto;
    return li;
  }

  const lista = document.getElementById("notas");
  if (!NOTAS.length) lista.outerHTML = '<p class="vazio">Nada anotado.</p>';
  NOTAS.forEach(nota => {
    if (typeof nota === "string") return lista.append(item(nota));
    const [titulo, etapas] = nota;
    const li = item(titulo);
    const sub = document.createElement("ul");
    sub.className = "etapas";
    etapas.forEach(etapa => sub.append(item(etapa)));
    li.append(sub);
    lista.append(li);
  });

  // Cada operação vira um bloco: subtítulo com o nome, depois a meta.
  const metas = document.getElementById("metas");
  METAS.forEach(([operacao, meta]) => {
    const bloco = document.createElement("div");
    bloco.className = "operacao";
    const titulo = document.createElement("h3");
    titulo.textContent = operacao;
    const ul = document.createElement("ul");
    ul.append(item(meta));
    bloco.append(titulo, ul);
    metas.append(bloco);
  });
</script>
</body>
</html>
