<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* Fonte padrão do Excalidraw (Excalifont, licença OFL), servida pelo CDN deles. */
  @font-face {
    font-family: "Excalifont";
    src: url("https://excalidraw.nyc3.cdn.digitaloceanspaces.com/oss/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --fundo: #ffffff;
    --tinta: #1e1e1e;
    --detalhe: #555555;
    --suave: #757575;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fundo);
    color: var(--tinta);
    font: 20px/1.6 "Excalifont", "Segoe Print", "Comic Sans MS", cursive;
  }
  .pagina {
    max-width: 1000px;
    margin: 0 auto;
    padding: 48px 32px 64px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 24px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  h1 { font-size: 32px; font-weight: 400; line-height: 1.25; margin: 0; }
  .atualizado { font-size: 17px; color: var(--suave); white-space: nowrap; }

  section { margin-bottom: 26px; }
  h2 { font-size: 24px; font-weight: 400; line-height: 1.25; margin: 0 0 8px; }

  ul { list-style: none; margin: 0; padding: 0 0 0 20px; }
  li { margin: 0; }
  li::before { content: "- "; }
  ul.detalhes { padding-left: 30px; color: var(--detalhe); }
  .vazio { color: var(--suave); }

  @media (max-width: 600px) {
    .pagina { padding: 28px 16px 40px; }
    body { font-size: 18px; }
    h1 { font-size: 28px; }
    h2 { font-size: 22px; }
    .atualizado { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <h1>Notas Spun - Tarefas</h1>
    <span class="atualizado" id="atualizado"></span>
  </header>
  <main id="quadro"></main>
</div>

<script>
  // ============================================================
  //  OPERAÇÕES: edite só esta parte.
  //  Item com detalhes: ["Título", ["linha 1", "linha 2"]].
  //  As metas ficam guardadas aqui, mas não aparecem no layout atual.
  // ============================================================
  const ATUALIZADO = "19/11/2026 às 14:11";

  const OPERACOES = [
    {
      nome: "JN US CC",
      metas: [
        "R$ 20 mil/dia com ROAS de −20%",
        ["R01: R$ 3 mil de gasto em geração de demanda", [
          "Com ROAS, o quanto antes",
        ]],
      ],
      tarefas: [
        "Subir novas campanhas com meta de compra",
        "Inserir novos anúncios responsivos em todas as subs (R01, R03 e R04)",
        ["Puxar campanhas antigas com bom desempenho e tentar destravar", [
          "Em todas as subs, inclusive as que estão pausadas",
        ]],
        "R01: inserir novos grupos de anúncio nas campanhas por conversão",
        ["R03: plano para destravar as campanhas por conversão", [
          "Subir segmentadas aos nossos domínios por um tempo",
        ]],
        "Puxar a conta que paga por conversão da JN US EMP",
      ],
    },
    {
      nome: "Roblox",
      metas: ["Estabilizar a compra abaixo de R$ 2,30, com ROAS"],
      tarefas: [],
    },
    {
      nome: "BG MX",
      metas: ["Estabilizar a compra buscando ROAS"],
      tarefas: ["Acompanhar canais de compra e otimização geral"],
    },
    {
      nome: "BG BR",
      metas: ["Estabilizar a compra buscando ROAS"],
      tarefas: ["Acompanhar canais de compra e otimização geral"],
    },
    {
      nome: "Shein",
      metas: ["Estabilizar a compra buscando ROAS"],
      tarefas: [
        "Criar novos criativos",
        "Acompanhar canais de compra e otimização geral",
      ],
    },
  ];
  // ============================================================

  const [dia, hora] = ATUALIZADO.split(" às ");
  document.getElementById("atualizado").textContent = `atualizado em ${dia} às ${hora}`;

  function el(tag, classe, texto) {
    const no = document.createElement(tag);
    if (classe) no.className = classe;
    if (texto) no.textContent = texto;
    return no;
  }

  const quadro = document.getElementById("quadro");
  OPERACOES.forEach(op => {
    const secao = el("section");
    const ul = el("ul");
    if (!op.tarefas.length) ul.append(el("li", "vazio", "Sem tarefas abertas"));
    op.tarefas.forEach(item => {
      const [titulo, detalhes] = typeof item === "string" ? [item, []] : item;
      const li = el("li", "", titulo);
      if (detalhes.length) {
        const sub = el("ul", "detalhes");
        detalhes.forEach(linha => sub.append(el("li", "", linha)));
        li.append(sub);
      }
      ul.append(li);
    });
    secao.append(el("h2", "", op.nome), ul);
    quadro.append(secao);
  });
</script>
</body>
</html>
