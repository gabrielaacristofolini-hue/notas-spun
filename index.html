<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* Fonte padrão do Excalidraw (Excalifont, licença OFL), servida pelo CDN deles. */
  @font-face {
    font-family: "Excalifont";
    src: url("https://excalidraw.nyc3.cdn.digitaloceanspaces.com/oss/fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2") format("woff2");
    font-display: swap;
  }
  :root {
    --fundo: #ffffff;
    --tinta: #1e1e1e;
    --detalhe: #555555;
    --suave: #757575;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fundo);
    color: var(--tinta);
    font: 20px/1.6 "Excalifont", "Segoe Print", "Comic Sans MS", cursive;
  }
  .pagina {
    margin: 0;
    padding: 48px 48px 64px;
  }
  /* Em tela larga as linhas nunca quebram: o texto segue em frente. */
  @media (min-width: 601px) {
    li { white-space: nowrap; }
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 24px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  h1 { font-size: 32px; font-weight: 400; line-height: 1.25; margin: 0; }
  .atualizado { font-size: 17px; color: var(--suave); white-space: nowrap; }

  section { margin-bottom: 26px; }
  h2 { font-size: 24px; font-weight: 400; line-height: 1.25; margin: 0 0 8px; }

  ul { list-style: none; margin: 0; padding: 0 0 0 20px; }
  li { margin: 0; }
  li::before { content: "- "; }
  ul.detalhes { padding-left: 30px; color: var(--detalhe); }
  .vazio { color: var(--suave); }

  /* Notas recolhidas: só o título aparece, os detalhes abrem com um clique. */
  li.recolhido::before { content: none; }
  li.recolhido summary { cursor: pointer; list-style: none; }
  li.recolhido summary::-webkit-details-marker { display: none; }
  li.recolhido summary::before { content: "- "; }
  li.recolhido summary::after { content: " (ver notas)"; color: var(--suave); font-size: 17px; }
  li.recolhido details[open] summary::after { content: " (esconder)"; }

  @media (max-width: 600px) {
    .pagina { padding: 28px 16px 40px; }
    body { font-size: 18px; }
    h1 { font-size: 28px; }
    h2 { font-size: 22px; }
    .atualizado { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <h1>Notas Spun - Tarefas</h1>
    <span class="atualizado" id="atualizado"></span>
  </header>
  <main id="quadro"></main>
</div>

<script>
  // Os dados ficam em notas.json. Este arquivo só desenha a página.
  function el(tag, classe, texto) {
    const no = document.createElement(tag);
    if (classe) no.className = classe;
    if (texto) no.textContent = texto;
    return no;
  }

  const quadro = document.getElementById("quadro");

  function desenhar({ atualizado, operacoes }) {
    const [dia, hora] = atualizado.split(" às ");
    document.getElementById("atualizado").textContent = `atualizado em ${dia} às ${hora}`;
    if (!operacoes.length) quadro.append(el("p", "vazio", "Nada anotado ainda."));
    operacoes.forEach(op => {
      const secao = el("section");
      const ul = el("ul");
      if (!op.tarefas.length) ul.append(el("li", "vazio", "Sem tarefas abertas"));
      op.tarefas.forEach(item => {
        // Item: "texto" ou ["Título", [linhas]]; um terceiro valor "recolhido" esconde as linhas até o clique.
        const [titulo, detalhes, modo] = typeof item === "string" ? [item, []] : item;
        const sub = el("ul", "detalhes");
        detalhes.forEach(linha => sub.append(el("li", "", linha)));
        let li;
        if (modo === "recolhido") {
          li = el("li", "recolhido");
          const caixa = el("details");
          caixa.append(el("summary", "", titulo), sub);
          li.append(caixa);
        } else {
          li = el("li", "", titulo);
          if (detalhes.length) li.append(sub);
        }
        ul.append(li);
      });
      secao.append(el("h2", "", op.nome), ul);
      quadro.append(secao);
    });
  }

  fetch("notas.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.json())
    .then(desenhar)
    .catch(() => quadro.append(el("p", "vazio", "Não foi possível carregar as notas.")));
</script>
</body>
</html>
