<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #e4e2dd;
    --tinta: #2a2a2a;
    --suave: #6f6c66;
    --linha: 2px solid var(--tinta);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--papel);
    color: var(--tinta);
    font: 500 18px/1.45 "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pagina {
    max-width: 1240px;
    margin: 0 auto;
    padding: 48px 24px 56px;
  }

  /* ---------- Cabeçalho ---------- */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(36px, 4.6vw, 64px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.045em;
    margin: 0 0 0 -.03em;
    white-space: nowrap;
  }
  .carimbo {
    display: flex;
    gap: 14px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -.01em;
    white-space: nowrap;
  }

  /* ---------- Quadro ---------- */
  .quadro {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  .celula { padding: 22px 26px 26px; border: var(--linha); }
  .rotulo {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
  }

  ol {
    margin: 0;
    padding-left: 26px;
  }
  ol li { padding-left: 4px; margin-bottom: 6px; }
  ol li::marker { font-weight: 500; }

  .vazio { color: var(--suave); margin: 0; }

  @media (max-width: 860px) {
    .quadro { grid-template-columns: 1fr; gap: 16px; }
  }
  @media (max-width: 600px) {
    .pagina { padding: 28px 16px 40px; }
    .carimbo { font-size: 15px; }
    body { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <h1>Notas Spun.</h1>
    <div class="carimbo">
      <span id="atualizado"></span>
      <span id="data"></span>
    </div>
  </header>

  <div class="quadro">
    <section class="celula">
      <p class="rotulo">Tarefas:</p>
      <ol id="notas"></ol>
    </section>
    <aside class="celula">
      <p class="rotulo">Metas:</p>
      <ol id="metas"></ol>
    </aside>
  </div>
</div>

<script>
  // ============================================================
  //  NOTAS e METAS: edite só esta parte.
  //  Escreva cada item como "Operação: tarefa".
  // ============================================================
  const ATUALIZADO = "06/11/2026 às 16:01";

  const NOTAS = [
    "JN US CC: subir novas campanhas com meta de compra",
    "JN US CC: subir novas campanhas de geração de demanda",
    "Puxar a conta que paga por conversão da JN US EMP para a JN US CC",
  ];

  // Metas: [operação, meta]
  const METAS = [
    ["JN US CC", "R$ 30 mil/dia com ROAS de −20%"],
    ["Roblox", "escalar com ROAS de +20% a +30%"],
    ["BG MX", "estabilizar a compra"],
  ];
  // ============================================================

  const [dia, hora] = ATUALIZADO.split(" às ");
  const [d, m, a] = dia.split("/");
  document.getElementById("data").textContent = `[ ${d}.${m}.${a.slice(2)} ]`;
  document.getElementById("atualizado").textContent = `atualizado às ${hora}`;

  // Tarefas e metas usam o mesmo formato: "operação: texto".
  function item(operacao, texto) {
    const li = document.createElement("li");
    li.textContent = operacao ? `${operacao}: ${texto}` : texto;
    return li;
  }

  const lista = document.getElementById("notas");
  if (!NOTAS.length) lista.outerHTML = '<p class="vazio">Nada anotado.</p>';
  NOTAS.forEach(texto => {
    const p = texto.match(/^([^:]{1,30}):\s*(.+)$/);
    lista.append(p ? item(p[1], p[2]) : item(null, texto));
  });

  const metas = document.getElementById("metas");
  METAS.forEach(([operacao, meta]) => metas.append(item(operacao, meta)));
</script>
</body>
</html>
