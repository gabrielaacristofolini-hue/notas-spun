<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas Spun</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mesa: #d9cdb8;
    --papel: #f7f1e3;
    --grade: rgba(96, 120, 150, .16);
    --tinta: #1f2a44;
    --lapis: #6b6458;
    --vermelho: #b8433a;
    --marca-amarela: rgba(255, 214, 10, .55);
    --marca-verde: rgba(120, 220, 170, .5);
    --marca-rosa: rgba(255, 150, 190, .45);
    --marca-azul: rgba(130, 190, 255, .45);
    --post-it: #fff2a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255, 255, 255, .35), transparent 60%),
      var(--mesa);
    color: var(--tinta);
    font: 400 22px/1.55 Kalam, "Segoe Print", cursive;
    padding: 40px 16px 64px;
  }

  .caderno {
    position: relative;
    max-width: 980px;
    margin: 0 auto;
    padding: 56px 56px 48px 72px;
    background-color: var(--papel);
    background-image:
      linear-gradient(var(--grade) 1px, transparent 1px),
      linear-gradient(90deg, var(--grade) 1px, transparent 1px);
    background-size: 26px 26px;
    border-radius: 3px 8px 8px 3px;
    box-shadow:
      inset 0 0 90px rgba(150, 110, 50, .14),
      inset 18px 0 24px -18px rgba(0, 0, 0, .18),
      0 2px 4px rgba(60, 40, 10, .12),
      0 18px 40px rgba(60, 40, 10, .22);
    transform: rotate(-.4deg);
  }
  /* furos da espiral */
  .caderno::before {
    content: "";
    position: absolute;
    left: 22px; top: 28px; bottom: 28px;
    width: 14px;
    background: radial-gradient(circle, var(--mesa) 5px, rgba(0, 0, 0, .18) 6px, transparent 7px) 0 0 / 14px 34px repeat-y;
  }

  h1 {
    font-family: Caveat, cursive;
    font-weight: 700;
    font-size: 56px;
    line-height: 1;
    margin: 0 0 28px;
  }
  h1 span {
    background: linear-gradient(100deg, transparent 2%, var(--marca-amarela) 4%, var(--marca-amarela) 96%, transparent 98%) 0 62% / 100% 52% no-repeat;
    padding: 0 6px;
  }

  .post-it {
    position: absolute;
    top: 30px; right: 36px;
    width: 170px;
    padding: 14px 14px 18px;
    background: var(--post-it);
    color: var(--lapis);
    font-family: Caveat, cursive;
    font-size: 21px;
    line-height: 1.15;
    text-align: center;
    transform: rotate(3deg);
    box-shadow: 0 6px 12px rgba(60, 40, 10, .18);
  }
  .post-it::before {
    content: "";
    position: absolute;
    top: -10px; left: 50%;
    width: 70px; height: 20px;
    margin-left: -35px;
    background: rgba(255, 255, 255, .55);
    transform: rotate(-4deg);
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    position: relative;
    padding: 6px 0 6px 38px;
    margin-bottom: 8px;
  }
  li::before {
    content: "→";
    position: absolute;
    left: 4px; top: 6px;
    color: var(--vermelho);
    font-weight: 700;
  }
  .marca {
    font-weight: 700;
    padding: 0 4px;
    margin-left: -4px;
    border-radius: 3px;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  .vazio { color: var(--lapis); font-style: italic; margin: 0; }

  .rabisco {
    display: block;
    width: 120px;
    margin: 36px 0 0 auto;
    color: var(--lapis);
    opacity: .7;
  }

  @media (max-width: 640px) {
    body { padding: 20px 10px 40px; font-size: 19px; }
    .caderno { padding: 120px 20px 32px 44px; transform: none; }
    .caderno::before { left: 12px; }
    h1 { font-size: 44px; }
    .post-it { top: 24px; right: 18px; width: 140px; font-size: 18px; }
    li { padding-left: 30px; }
  }
</style>
</head>
<body>
<main class="caderno">
  <div class="post-it" id="atualizado"></div>
  <h1><span>Notas Spun</span></h1>
  <ul id="notas"></ul>
  <svg class="rabisco" viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
    <path d="M4 26c14-12 22 8 34-4s18-10 28 2 20 6 30-6 14-6 20 2"/>
    <path d="M100 8l4 6 7 1-5 5 1 7-7-3-6 3 1-7-5-5 7-1z"/>
  </svg>
</main>

<script>
  // ============================================================
  //  NOTAS — edite só esta parte.
  //  "Operação: tarefa" deixa a operação marcada com marca-texto.
  // ============================================================
  const ATUALIZADO = "06/11/2026 às 13:51";

  const NOTAS = [
    "JN US CC: subir novas campanhas com meta de compra",
    "JN US CC: subir novas campanhas de geração de demanda",
    "Puxar a conta que paga por conversão da JN US EMP para a JN US CC",
    "BG (México): criar criativos estáticos para display e para responsivos",
  ];
  // ============================================================

  const [dia, hora] = ATUALIZADO.split(" às ");
  document.getElementById("atualizado").textContent = `atualizado em ${dia}, ${hora}`;

  // Cada operação ganha sempre a mesma cor de marca-texto.
  const cores = ["--marca-amarela", "--marca-verde", "--marca-rosa", "--marca-azul"];
  const corDe = {};
  const lista = document.getElementById("notas");
  if (!NOTAS.length) lista.outerHTML = '<p class="vazio">Nada anotado.</p>';
  NOTAS.forEach(texto => {
    const li = document.createElement("li");
    const m = texto.match(/^([^:]{1,30}):\s*(.+)$/);
    if (m) {
      if (!(m[1] in corDe)) corDe[m[1]] = cores[Object.keys(corDe).length % cores.length];
      const marca = document.createElement("span");
      marca.className = "marca";
      marca.style.background = `var(${corDe[m[1]]})`;
      marca.textContent = m[1];
      li.append(marca, ": " + m[2]);
    } else {
      li.textContent = texto;
    }
    lista.append(li);
  });
</script>
</body>
</html>
